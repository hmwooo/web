<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Master Pro</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #3498db;
            --secondary-color: #2ecc71;
            --danger-color: #e74c3c;
            --warning-color: #f39c12;
            --bg-dark: #2c3e50;
            --text-light: #ecf0f1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
        }

        .app-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            display: flex;
            justify-content: space-around;
            background-color: rgba(44, 62, 80, 0.9);
            padding: 15px;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
        }

        .navbar-btn {
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 24px;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .navbar-btn.active {
            color: var(--primary-color);
        }

        .page {
            display: none;
            flex-grow: 1;
            animation: fadeIn 0.5s ease;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Dashboard Styles */
        .dashboard-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background-color: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }

        /* Task Styles */
        .task-input {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .task-input input, 
        .task-input select {
            flex-grow: 1;
            padding: 10px;
            background-color: rgba(255,255,255,0.1);
            border: 2px solid var(--primary-color);
            border-radius: 5px;
            color: var(--text-light);
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        .task-list {
            list-style-type: none;
        }

        .task-item {
            background-color: rgba(255,255,255,0.1);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .task-item.completed {
            opacity: 0.6;
            text-decoration: line-through;
        }

        /* Projects Styles */
        .project-card {
            background-color: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Analytics Styles */
        .chart-container {
            background-color: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }

        /* Pomodoro Styles */
        .pomodoro-timer {
            text-align: center;
            background-color: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 20px;
        }

        .timer-display {
            font-size: 3rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Dashboard Page -->
        <div id="dashboard" class="page active">
            <h1>لوحة التحكم</h1>
            <div class="dashboard-stats">
                <div class="stat-card">
                    <h3>المهام الكلية</h3>
                    <p id="total-tasks">0</p>
                </div>
                <div class="stat-card">
                    <h3>المهام المكتملة</h3>
                    <p id="completed-tasks">0</p>
                </div>
            </div>
        </div>

        <!-- Tasks Page -->
        <div id="tasks" class="page">
            <h1>المهام</h1>
            <div class="task-input">
                <input type="text" id="task-title" placeholder="عنوان المهمة">
                <select id="task-priority">
                    <option value="low">منخفضة</option>
                    <option value="medium">متوسطة</option>
                    <option value="high">عالية</option>
                </select>
                <button class="btn" onclick="addTask()">إضافة</button>
            </div>
            <ul id="task-list" class="task-list"></ul>
        </div>

        <!-- Projects Page -->
        <div id="projects" class="page">
            <h1>المشاريع</h1>
            <div class="task-input">
                <input type="text" id="project-name" placeholder="اسم المشروع">
                <button class="btn" onclick="addProject()">إنشاء</button>
            </div>
            <div id="projects-list"></div>
        </div>

        <!-- Pomodoro Page -->
        <div id="pomodoro" class="page">
            <div class="pomodoro-timer">
                <div class="timer-display" id="timer-display">25:00</div>
                <div>
                    <button class="btn" onclick="startPomodoro()">بدء</button>
                    <button class="btn" onclick="pausePomodoro()">إيقاف</button>
                    <button class="btn" onclick="resetPomodoro()">إعادة ضبط</button>
                </div>
            </div>
        </div>

        <!-- Analytics Page -->
        <div id="analytics" class="page">
            <h1>التحليلات</h1>
            <div class="chart-container">
                <h3>إحصائيات المهام</h3>
                <div id="task-chart"></div>
            </div>
        </div>
    </div>

    <!-- Navigation Bar -->
    <div class="navbar">
        <button class="navbar-btn active" onclick="switchPage('dashboard')">
            <i class="fas fa-home"></i>
        </button>
        <button class="navbar-btn" onclick="switchPage('tasks')">
            <i class="fas fa-list-ul"></i>
        </button>
        <button class="navbar-btn" onclick="switchPage('projects')">
            <i class="fas fa-project-diagram"></i>
        </button>
        <button class="navbar-btn" onclick="switchPage('pomodoro')">
            <i class="fas fa-clock"></i>
        </button>
        <button class="navbar-btn" onclick="switchPage('analytics')">
            <i class="fas fa-chart-bar"></i>
        </button>
    </div>

    <script>
        // State Management
        class StateManager {
            constructor() {
                this.tasks = JSON.parse(localStorage.getItem('tasks')) || [];
                this.projects = JSON.parse(localStorage.getItem('projects')) || [];
            }

            saveTasks() {
                localStorage.setItem('tasks', JSON.stringify(this.tasks));
                this.updateDashboard();
            }

            saveProjects() {
                localStorage.setItem('projects', JSON.stringify(this.projects));
            }

            updateDashboard() {
                const totalTasks = this.tasks.length;
                const completedTasks = this.tasks.filter(t => t.completed).length;

                document.getElementById('total-tasks').textContent = totalTasks;
                document.getElementById('completed-tasks').textContent = completedTasks;
            }
        }

        // Initialize State
        const state = new StateManager();

        // Page Switching
        function switchPage(pageId) {
            // Hide all pages
            ['dashboard', 'tasks', 'projects', 'pomodoro', 'analytics']
                .forEach(id => document.getElementById(id).classList.remove('active'));
            
            // Show selected page
            document.getElementById(pageId).classList.add('active');

            // Update navbar active state
            document.querySelectorAll('.navbar-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.currentTarget.classList.add('active');
        }

        // Task Management
        function addTask() {
            const titleInput = document.getElementById('task-title');
            const prioritySelect = document.getElementById('task-priority');
            const taskList = document.getElementById('task-list');

            if (!titleInput.value.trim()) return;

            const task = {
                id: Date.now(),
                title: titleInput.value,
                priority: prioritySelect.value,
                completed: false,
                createdAt: new Date()
            };

            state.tasks.push(task);
            state.saveTasks();
            renderTasks();

            titleInput.value = '';
            prioritySelect.value = 'low';
        }

        function renderTasks() {
            const taskList = document.getElementById('task-list');
            taskList.innerHTML = '';

            state.tasks.forEach(task => {
                const li = document.createElement('li');
                li.classList.add('task-item');
                if (task.completed) li.classList.add('completed');

                li.innerHTML = `
                    <span>${task.title} (${task.priority})</span>
                    <div>
                        <button onclick="toggleTaskComplete(${task.id})">✓</button>
                        <button onclick="deleteTask(${task.id})">🗑️</button>
                    </div>
                `;

                taskList.appendChild(li);
            });
        }

        function toggleTaskComplete(taskId) {
            const task = state.tasks.find(t => t.id === taskId);
            if (task) {
                task.completed = !task.completed;
                state.saveTasks();
                renderTasks();
            }
        }

        function deleteTask(taskId) {
            state.tasks = state.tasks.filter(t => t.id !== taskId);
            state.saveTasks();
            renderTasks();
        }

        // Project Management
        function addProject() {
            const projectInput = document.getElementById('project-name');
            const projectsList = document.getElementById('projects-list');

            if (!projectInput.value.trim()) return;

            const project = {
                id: Date.now(),
                name: projectInput.value,
                createdAt: new Date(),
                tasks: []
            };

            state.projects.push(project);
            state.saveProjects();
            renderProjects();

            projectInput.value = '';
        }

        function renderProjects() {
            const projectsList = document.getElementById('projects-list');
            projectsList.innerHTML = '';

            state.projects.forEach(project => {
                const div = document.createElement('div');
                div.classList.add('project-card');
                div.innerHTML = `
                    <span>${project.name}</span>
                    <div>
                        <button onclick="deleteProject(${project.id})">🗑️</button>
                    </div>
                `;
                projectsList.appendChild(div);
            });
        }

        function deleteProject(projectId) {
            state.projects = state.projects.filter(p => p.id !== projectId);
            state.saveProjects();
            renderProjects();
        }

        // Pomodoro Timer
        let pomodoroTimer;
        let timeLeft = 25 * 60; // 25 minutes
        let isRunning = false;

        function startPomodoro() {
            if (!isRunning) {
                isRunning = true;
                pomodoroTimer = setInterval(updateTimer, 1000);
            }
        }

        function pausePomodoro() {
            clearInterval(pomodoroTimer);
            isRunning = false;
        }

        function resetPomodoro() {
            clearInterval(pomodoroTimer);
            isRunning = false;
            timeLeft = 25 * 60;
            updateTimerDisplay();
        }

        function updateTimer() {
            if (timeLeft > 0) {
                timeLeft--;
                updateTimerDisplay();
            } else {
                clearInterval(pomodoroTimer);
                isRunning = false;
                alert('انتهى وقت العمل!');
            }
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            document.getElementById('timer-display').textContent = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        // Initial Renders
        renderTasks();
        renderProjects();
        state.updateDashboard();
    </script>
</body>
</html>
